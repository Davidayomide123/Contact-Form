<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Karla:ital,wght@0,200..800;1,200..800&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Karla", sans-serif;
      background-color: hsl(148, 38%, 91%);
      padding: 60px 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
    }

    form {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      border-radius: 10px;
      width: 600px;
      padding: 35px 30px 40px;
      gap: 20px;
      background-color: white;
      box-shadow: 3px 3px 50px 5px rgb(236, 232, 232);
    }

    .contact {
      margin-bottom: 5px;
      align-self: flex-start;
      font-weight: 600;
      font-size: 1.8rem;
      color: hsl(169, 82%, 27%);
    }

    .group-names { display: flex; gap: 10px; width: 100%; }
    .group-box { display: flex; flex-direction: column; gap: 8px; flex: 1; }

    .group-inputs, .email-input, .message-input {
      border: 1px solid hsl(186, 15%, 59%);
      border-radius: 5px;
      font-family: "Karla", sans-serif;
      font-size: 1rem;
      outline: none;
      transition: border 0.2s;
    }

    .group-inputs { height: 48px; width: 100%; padding: 0 15px; }
    .email { display: flex; flex-direction: column; gap: 8px; width: 100%; }
    .email-input { height: 48px; width: 100%; padding: 0 15px; }

    .query-section { display: flex; flex-direction: column; gap: 8px; width: 100%; }
    .query-options { display: flex; gap: 12px; width: 100%; }

    .query-box {
      display: flex;
      align-items: center;
      height: 48px;
      width: 100%;
      border: 1px solid hsl(186, 15%, 59%);
      border-radius: 5px;
      background-color: white;
      cursor: pointer;
      gap: 12px;
      padding-left: 15px;
      transition: all 0.2s;
      font-size: 1rem;
    }
    .query-box:hover { border-color: hsl(169, 82%, 27%); }
    .query-box input[type="radio"] { transform: scale(1.3); accent-color: hsl(169, 82%, 27%); cursor: pointer; }

    .message-box { display: flex; flex-direction: column; gap: 8px; width: 100%; }
    .message-input { height: 110px; width: 100%; padding: 12px 15px; resize: vertical; }

    .consent { display: flex; align-items: center; width: 100%; gap: 12px; margin-top: 5px; }
    .consent input[type="checkbox"] { transform: scale(1.3); accent-color: hsl(169, 82%, 27%); cursor: pointer; }
    .consent label { font-size: 1rem; color: hsl(187, 24%, 22%); }

    .submit {
      width: 100%;
      height: 52px;
      border: none;
      border-radius: 5px;
      background-color: hsl(169, 82%, 27%);
      color: white;
      cursor: pointer;
      font-family: "Karla", sans-serif;
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      transition: background 0.2s;
      margin-top: 10px;
    }
    .submit:hover { background-color: hsl(169, 82%, 20%); }
    .submit:disabled { background-color: hsl(169, 30%, 50%); cursor: not-allowed; }

    span { color: hsl(169, 82%, 27%); font-weight: 600; }

    /* success / error message */
    .status {
      width: 100%;
      padding: 14px;
      border-radius: 5px;
      font-size: 0.95rem;
      text-align: center;
      display: none;
    }
    .status.success { display: block; background: hsl(148, 60%, 90%); color: hsl(169, 82%, 20%); border: 1px solid hsl(169, 82%, 27%); }
    .status.error   { display: block; background: hsl(0, 80%, 95%); color: hsl(0, 70%, 35%); border: 1px solid hsl(0, 70%, 50%); }
  </style>
</head>
<body>
  <div class="container">
    <form id="contactForm">
      <h1 class="contact">Contact Us</h1>

      <div class="group-names">
        <div class="group-box">
          <label for="firstname">First Name <span>*</span></label>
          <input type="text" id="firstname" name="firstname" required class="group-inputs" placeholder="John">
        </div>
        <div class="group-box">
          <label for="lastname">Last Name <span>*</span></label>
          <input type="text" id="lastname" name="lastname" required class="group-inputs" placeholder="Doe">
        </div>
      </div>

      <div class="email">
        <label for="email">Email Address <span>*</span></label>
        <input type="email" id="email" name="email" required class="email-input" placeholder="john@example.com">
      </div>

      <div class="query-section">
        <label>Query Type <span>*</span></label>
        <div class="query-options">
          <label class="query-box">
            <input type="radio" name="query_type" value="General Enquiry" required>
            General Enquiry
          </label>
          <label class="query-box">
            <input type="radio" name="query_type" value="Support Request" required>
            Support Request
          </label>
        </div>
      </div>

      <div class="message-box">
        <label for="message">Message <span>*</span></label>
        <textarea id="message" name="message" required class="message-input" placeholder="Write your message here..."></textarea>
      </div>

      <div class="consent">
        <input type="checkbox" id="consent" name="consent" required>
        <label for="consent">I consent to being contacted by the team <span>*</span></label>
      </div>

      <button type="submit" class="submit" id="submitBtn">Submit</button>

      <!-- Status message will appear here -->
      <div class="status" id="statusMsg"></div>
    </form>
  </div>

  <script>
    // ---------------------------------------------------------------
    // STEP 1: PASTE YOUR WEB3FORMS ACCESS KEY BELOW
    // Get it free at https://web3forms.com (just enter your email)
    // ---------------------------------------------------------------
    const ACCESS_KEY = "863dba27-7bb8-48c6-acba-29960da63f74";

    const form = document.getElementById("contactForm");
    const submitBtn = document.getElementById("submitBtn");
    const statusMsg = document.getElementById("statusMsg");

    form.addEventListener("submit", async function (e) {
      e.preventDefault(); // stop the page from reloading

      // Basic check — make sure the user replaced the placeholder
      if (ACCESS_KEY === "PASTE-YOUR-WEB3FORMS-ACCESS-KEY-HERE") {
        showStatus("error", "⚠️ Please add your Web3Forms Access Key in the script (see line 1 of the <script> section).");
        return;
      }

      // Disable button while sending
      submitBtn.disabled = true;
      submitBtn.textContent = "Sending...";
      statusMsg.className = "status";
      statusMsg.style.display = "none";

      // Collect form data
      const formData = new FormData(form);

      // Required by Web3Forms
      formData.append("access_key", ACCESS_KEY);

      // Optional: custom subject line for your inbox
      formData.append("subject", "New Contact Form Submission");
      formData.append("from_name", "Contact Form · Your Website");

      try {
        const response = await fetch("https://api.web3forms.com/submit", {
          method: "POST",
          body: formData
        });

        const data = await response.json();

        if (data.success) {
          showStatus("success", "✅ Thank you! Your message has been sent. I'll get back to you soon.");
          form.reset(); // clear all fields
        } else {
          showStatus("error", "❌ Something went wrong: " + (data.message || "Please try again."));
        }
      } catch (error) {
        showStatus("error", "❌ Network error. Please check your connection and try again.");
        console.error(error);
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Submit";
      }
    });

    function showStatus(type, message) {
      statusMsg.textContent = message;
      statusMsg.className = "status " + type;
      statusMsg.style.display = "block";
      statusMsg.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }
  </script>
</body>
</html>
