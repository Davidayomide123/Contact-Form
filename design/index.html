<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="style.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <div class="container">
    
    <form action="">

      <h1 class="contact">Contact Us</h1>

      <div class="group-names">

        <div class="group-box">
          <label for="firstname">First Name <span>*</span></label>
          <input type="text" required class="group-inputs">
        </div>

        <div class="group-box">
          <label for="lastname">Last Name <span>*</span></label>
          <input type="text" required class="group-inputs">
        </div>

      </div>

      <div class="email">
        <label for="">Email Address <span>*</span></label>
        <input type="email" required class="email-input">
      </div>

      <div class="query-section">

        <label for="Query type">Query Type <span>*</span></label>

        <div class="query-options">

          <div>
            <button class="query-box"><input type="radio">General Enquiry</button>
          </div>

          <div >
            <button class="query-box"><input type="radio">Support Request</button>
          </div>

        </div>
      </div>
      
      <div class="message-box">
        <label for="">Message <span>*</span></label>
        <textarea name="" id="" class="message-input"></textarea>
      </div>

      <div class="consent">
        <input type="checkbox" class="consent-box">
        <label for="">I consent to being contacted by the team</label>
      </div>

      <button type="submit" class="submit">Submit</button>
    </form>
  </div>
</body>
</html>
